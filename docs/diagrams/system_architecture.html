<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GlucoTwin-X System Architecture</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 26px;
      color: #38bdf8;
    }
    p {
      margin: 0;
      color: #94a3b8;
      font-size: 14px;
    }
    .container {
      width: 100%;
      max-width: 1200px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    img, svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 12px;
    }
    button {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    @media print {
      body {
        padding: 0;
        background: #0b0f19 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .controls {
        display: none;
      }
      .container {
        border: none;
        box-shadow: none;
        padding: 0;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>GlucoTwin-X System Architecture</h1>
    <p>Team: Van Der Linde Gang (Aryan Ranadive, Shubham Sukhadare) • Healthcare AI Digital Twin</p>
  </div>
  <div class="container">
    <object data="system_architecture.svg" type="image/svg+xml" width="100%" height="auto"></object>
  </div>
  <div class="controls">
    <button onclick="window.print()">Print / Save as PDF</button>
  </div>
</body>
</html>
